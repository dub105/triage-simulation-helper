<!doctype html>
<html lang="ja"><head>

<style>
/* Layout: 運営スタッフが複数端末で使う判定ツール。判定タブは「症例番号の入力 → 搬送手段 → 搬送先カード → 判定結果」の縦並び */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;

  --muted: #5a6578;
  --line: #d6dce6;
  --accent: #1f4f8f;
  --accent-fg: #ffffff;
  --accent-soft: #e2ebf7;
  --ok: #17734a;
  --ok-bg: #def3e7;
  --ng: #b0271f;
  --ng-bg: #fbe3e0;
  --warn: #7d5200;
  --warn-bg: #fbefcf;
  --preg: #a3306b;
  --preg-bg: #f9e3ee;
  --child: #1c6a8a;
  --child-bg: #dff0f7;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161f;
    --surface: #1a212d;
    --fg: #e6ebf3;
    --muted: #98a3b6;
    --line: #2f3a4b;
    --accent: #7fb0f0;
    --accent-fg: #0e1622;
    --accent-soft: #223149;
    --ok: #6fd6a0;
    --ok-bg: #173a2b;
    --ng: #ff9a91;
    --ng-bg: #4a1f1c;
    --warn: #f0c970;
    --warn-bg: #43330f;
    --preg: #f2a4c8;
    --preg-bg: #46202f;
    --child: #8fd3ee;
    --child-bg: #173543;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161f;
  --surface: #1a212d;
  --fg: #e6ebf3;
  --muted: #98a3b6;
  --line: #2f3a4b;
  --accent: #7fb0f0;
  --accent-fg: #0e1622;
  --accent-soft: #223149;

body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }

.hgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }

.btn.sm { padding: 4px 10px; font-size: .85rem; }
.row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.empty { color: var(--muted); padding: 20px 4px; }
.status { min-height: 1.6em; color: var(--ok); font-weight: 500; }

.fields { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; min-width: 0; }
.fields .nm { flex: 1 1 200px; }
.fields .num { width: 84px; }
.fields .cno { width: 90px; }
.cb { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.addform { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.addform .grow { flex: 1 1 200px; }
.err { color: var(--ng); font-weight: 500; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin: 0 0 12px; }
table.log { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.log th, table.log td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); }
table.log th { font-size: .78rem; color: var(--muted); letter-spacing: .08em; border-top: 0; }
.scroll { overflow-x: auto; }
.modesw { display: inline-flex; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
.modesw button { font: inherit; font-weight: 700; font-size: .85rem; padding: 6px 14px; border: 0; background: var(--surface); color: var(--muted); cursor: pointer; }
.modesw button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.pinform { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pinform input { width: 9.5rem; }
.pinerr { color: var(--ng); font-size: .85rem; font-weight: 500; }
.modetag { font-size: .85rem; font-weight: 700; color: var(--muted); border: 2px solid var(--line); border-radius: 8px; padding: 5px 12px; }
.lrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: center; }
.lrow:first-child { border-top: 0; }
.lmain { overflow-wrap: anywhere; }
.lsub { grid-column: 1; color: var(--muted); font-size: .88rem; font-variant-numeric: tabular-nums; }
.lsub .cd { color: var(--accent); font-weight: 700; }
.lact { grid-column: 2; grid-row: 1 / span 2; }
.transit { display: flex; flex-direction: column; }
.trow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.trow:first-of-type { border-top: 0; }
.wlabel { font-weight: 700; font-size: 1.05rem; }
.trow .cd { font-family: var(--font-display); font-weight: 900; font-size: 1.3rem; font-variant-numeric: tabular-nums; color: var(--accent); }
td .cd { font-weight: 700; font-variant-numeric: tabular-nums; }
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; }

  h1 { font-size: 1.4rem; }

  .item { grid-template-columns: minmax(0, 1fr); }
}

<script>
/* Firestore アダプタ: アプリ本体が使う最小限の db API を Firebase Firestore で実装する */
window.makeDb = function () {
  var cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.projectId || /^YOUR_/.test(cfg.projectId) || typeof firebase === 'undefined') return null;
  firebase.initializeApp(cfg);
  var fs = firebase.firestore();
  function flat(patch) {
    var o = {};
    Object.keys(patch).forEach(function (k) {
      var v = patch[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) Object.keys(v).forEach(function (s) { o[k + '.' + s] = v[s]; });
      else o[k] = v;
    });
    return o;
  }
  function wrapSnap(s) { return { docs: s.docs, size: s.size, metadata: s.metadata }; }
  function query(q) {
    return {
      where: function (f, op, v) { return query(q.where(f, op, v)); },
      get: function () { return q.get().then(wrapSnap); },
      onSnapshot: function (ok, ng) { return q.onSnapshot(function (s) { ok(wrapSnap(s)); }, ng); }
    };
  }
  return {
    collection: function (c) {
      var ref = fs.collection(c), q = query(ref);
      q.add = function (data) { return ref.add(data); };
      return q;
    },
    doc: function (p) {
      var ref = fs.doc(p);
      return {
        get: function () { return ref.get(); },
        set: function (d) { return ref.set(d); },
        update: function (patch) { return ref.update(flat(patch)); },
        delete: function () { return ref.delete(); },
        acquire: function (o) {
          return fs.runTransaction(function (tx) {
            return tx.get(ref).then(function (s) {
              var now = Date.now(), cur = s.exists ? s.data() : null;
              if (cur && cur.exp > now && cur.holder !== o.holder) return { acquired: false };
              tx.set(ref, { holder: o.holder, exp: now + (o.ttlMs || 1000) });
              return { acquired: true };
            });
          });
        }
      };
    }
  };
};
</script>
<script>
(function () {
  var tabId = Math.random().toString(36).slice(2);
  var db = null;
  var ro = false;
  var isAdmin = true; /* 誰でもスタッフモードへ切替可能。入るには認証コードが必要（設定後） */
  var S = { ended: false, endedAt: 0, sections: [], secMap: {}, hospitals: [], cases: [], methods: [], log: [], cfg: [], cfgReady: false, pinHash: '', pinSalt: '', showReason: true, supplies: [], procs: [], treats: [], supUsed: {}, teams: [], teamsReady: false, caseMap: {}, logMap: {}, usedBy: {} };
  function teamOk(id) { for (var i = 0; i < S.teams.length; i++) if (S.teams[i].id === id) return true; return false; }
  function teamName(id) { for (var i = 0; i < S.teams.length; i++) if (S.teams[i].id === id) return S.teams[i].name; return '削除されたチーム'; }
  function loadMode() { try { return localStorage.getItem('triage-mode') === 'participant' ? 'participant' : 'staff'; } catch (e) { return 'staff'; } }
  function isStaff() { return isAdmin && ui.mode === 'staff' && S.cfgReady && (!S.pinHash || ui.pinOk); }
  function tabAllowed(t) { return isStaff() || t === 'wait' || (t === 'result' && S.ended); }
  function homeTab() { return isStaff() ? 'judge' : 'wait'; }
  function loadTeam() { try { return localStorage.getItem('triage-team') || null; } catch (e) { return null; } }
  var ui = {
    team: loadTeam(), tCase: '', pid: null, tdone: null, tbusy: false,
    tab: 'wait', mode: loadMode(), caseNo: '', hid: null, mid: null, armed: null,
    msg: '', msgBad: false, err: '', done: null, busy: false, filter: '', bulkMsg: '', dbState: 'loading'
  };
  var pending = false;
  var timer = 0;

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s || '')
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFF10 + 48); })
      .replace(/[Ａ-Ｚａ-ｚ]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[　\s]+/g, '').trim();
  }
  var CATS = [['trauma', '外傷'], ['brain', '脳疾患'], ['burn', '熱傷']];
  var TAGS = [['black', '黒'], ['red', '赤'], ['yellow', '黄'], ['green', '緑']];
  var HATTR = [['trauma', '外傷'], ['brain', '脳疾患'], ['burn', '熱傷'], ['preg', '妊婦'], ['ped', '小児'], ['red', '赤タグ'], ['yellow', '黄タグ'], ['green', '緑タグ']];
  var CATTR = ['trauma', 'brain', 'burn', 'preg', 'child'];
  var HKEYS = HATTR.map(function (a) { return a[0]; });
  function yes(x) { return /^(○|〇|◯|o|1|可|true|yes|y)$/i.test(String(x || '').trim()); }
  function tagName(t) { for (var i = 0; i < TAGS.length; i++) if (TAGS[i][0] === t) return TAGS[i][1]; return ''; }
  function validId(s) { return /^[A-Za-z0-9_\-.~:@+]{1,50}$/.test(s) && s !== '.' && s !== '..'; }
  function byNo(a, b) { return String(a.no).localeCompare(String(b.no), 'ja', { numeric: true }); }
  function byOrd(a, b) { return (a.ord - b.ord) || String(a.name).localeCompare(String(b.name), 'ja'); }
  function hosp(id) { for (var i = 0; i < S.hospitals.length; i++) if (S.hospitals[i].id === id) return S.hospitals[i]; return null; }
  function meth(id) { for (var i = 0; i < S.methods.length; i++) if (S.methods[i].id === id) return S.methods[i]; return null; }
  function supply(id) { for (var i = 0; i < S.supplies.length; i++) if (S.supplies[i].id === id) return S.supplies[i]; return null; }
  function proc(id) { for (var i = 0; i < S.procs.length; i++) if (S.procs[i].id === id) return S.procs[i]; return null; }
  function supRemaining(sp, team) { return Math.max(0, sp.stock - (S.supUsed[team + '|' + sp.id] || 0)); }
  function shortages(p, team) {
    var r = [];
    Object.keys(p.needs).forEach(function (sid) {

  async function confirmTreat() {
    if (ui.tbusy || !canWrite()) return;
    var c = S.caseMap[ui.tCase], pr = proc(ui.pid), team = ui.team;
    if (!c || !pr || !team) return;
    if (S.ended) { setStatus('全セクションが終了しました。処置はできません。', true); renderTreatDyn(); return; }
    if (tagInfo(c, team).state === 'notstarted') { setStatus(notStartedMsg(c), true); renderTreatDyn(); return; }
    if (tagInfo(c, team).tag === 'black') { setStatus('この症例は黒タグ（死亡）のため処置できません。', true); renderTreatDyn(); return; }
    ui.tbusy = true; setStatus('', false); renderTreatDyn();
    try {
      var lock = null;
      for (var i = 0; i < 4; i++) {
        lock = await db.doc('locks/treat:' + team).acquire({ holder: tabId, ttlMs: 1000 });
        if (lock.acquired) break;
        await sleep(600);
      }
      if (!lock || !lock.acquired) { setStatus('他の端末が処置を登録中です。もう一度「処置を開始する」を押してください。', true); return; }
      var fresh = await db.collection('treatments').where('team', '==', team).get();
      var usedNow = {};
      fresh.docs.forEach(function (d) { ((d.data() || {}).items || []).forEach(function (it) { usedNow[it.sid] = (usedNow[it.sid] || 0) + (+it.qty || 0); }); });
      var items = [], bad = [];
      Object.keys(pr.needs).forEach(function (sid) {
        var sp = supply(sid), q = +pr.needs[sid] || 0;
        if (!sp || q <= 0) return;
        if (sp.stock - (usedNow[sid] || 0) < q) bad.push(sp.name);
        items.push({ sid: sid, name: sp.name, qty: q });
      });
      if (bad.length) { setStatus('他の端末の処置で ' + bad.join('、') + ' が不足しました。処置は開始していません。', true); return; }
      await db.collection('treatments').add({ team: team, caseNo: c.no, pid: pr.id, pname: pr.name, min: pr.min, items: items, t: Date.now(), el: secElapsed(secOf(c)) });
      ui.tdone = { team: team, no: c.no, pname: pr.name, min: pr.min, usedText: items.map(function (it) { return it.name + '×' + it.qty; }).join('　') };
      ui.tCase = '';
      var inp = document.getElementById('tCaseNo');
      if (inp) { inp.value = ''; inp.focus(); }
    } catch (e) {
      setStatus('処置を開始できませんでした。通信を確認して、もう一度お試しください。', true);
    } finally {
      ui.tbusy = false; renderTreatDyn();
    }
  }

  function cyrb53(str, seed) {
    var h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed;
    for (var i = 0, ch; i < str.length; i++) {
      ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
  }
  function hashPin(code, salt) { return cyrb53(salt + ':' + code, 7) + cyrb53(code + ':' + salt, 13); }

    if (S.pinHash && hashPin(code, S.pinSalt) === S.pinHash) {

  async function confirmTransport() {

    if (!c || !h || !m || !team) return;

    try {

      }
      chain.then(function () {
        ui.bulkMsg = items.length + '件を登録しました。' + (skip ? '登録済みの ' + skip + '件はスキップ。' : '') + (bad ? '番号が不正な ' + bad + '件は登録していません。' : '');
        renderBody();
      }).catch(function (err) { ui.bulkMsg = '登録できませんでした。一部だけ登録されている可能性があります。症例の一覧を確認してください。'; renderBody(); failed(err); });
    }
  }
  app.addEventListener('submit', onSubmit);
  document.getElementById('modesw').addEventListener('submit', onSubmit);

  /* ---------- countdown ---------- */
  var tk = { key: '', tag: '' }, tickN = 0;
  function tickTag() {
    var no = ui.tab === 'judge' ? ui.caseNo : ui.tab === 'treat' ? ui.tCase : '';
    var c = no ? S.caseMap[no] : null;
    if (!c || !teamOk(ui.team)) { tk.key = ''; return false; }
    var line = document.querySelector('.tgline');
    var ti = tagInfo(c, ui.team), key = no + '|' + ui.team, worse = false, changed = false;
    if (tk.key === key && tk.tag !== ti.tag) { changed = true; worse = (RANK[ti.tag] || 0) > (RANK[tk.tag] || 0); }
    tk.key = key; tk.tag = ti.tag;
    if (line && !changed) { var t = tagLine(c, ui.team); if (t) line.innerHTML = t; }
    if (worse) beep('worse');
    return changed;
  }
  setInterval(function () {
    var now = Date.now(), crossed = false, ring = null;
    var els = document.querySelectorAll('.cd');
    for (var i = 0; i < els.length; i++) {
      var el = els[i], rem = (+el.getAttribute('data-end')) - now;
      if (rem > 0) { el.textContent = '残り ' + fmt(rem); }
      else if (el.getAttribute('data-done') !== '1') {
        el.setAttribute('data-done', '1'); el.textContent = el.getAttribute('data-dt') || '到着'; crossed = true;
        if (el.getAttribute('data-live') === '1' && el.getAttribute('data-snd')) ring = el.getAttribute('data-snd');
      }
    }
    var tg = tickTag();
    tickN++;
    if (crossed || tg) { if (ui.tab === 'judge') renderJudgeDyn(); else if (ui.tab === 'treat') renderTreatDyn(); else if (ui.tab === 'wait') renderWaitDyn(); }
    else if (ui.tab === 'wait' && tickN % 10 === 0) renderWaitDyn();
    if (ring) beep(ring);
    var se = document.querySelectorAll('.secel');
    for (var j = 0; j < se.length; j++) { var sx2 = S.secMap[se[j].getAttribute('data-sid')]; if (sx2) se[j].textContent = secText(sx2); }
  }, 1000);

  /* ---------- start ---------- */
  renderSnd();
  renderAll();
  (async function () {
    try { db = window.makeDb ? window.makeDb() : null; } catch (e) { db = null; }
    if (!db) { ui.dbState = 'none'; renderBanner(); return; }
    ui.dbState = 'ok';
    renderAll();
    sub('config', 'cfg', function (id, v) { return { id: id, showReason: v.showReason !== false, pinHash: String(v.pinHash || ''), pinSalt: String(v.pinSalt || ''), ended: !!v.ended, endedAt: +v.endedAt || 0, ord: 0, name: id }; });
    sub('hospitals', 'hospitals', function (id, v) { return { id: id, name: String(v.name || ''), cap: +v.cap || 0, preg: !!v.preg, ped: !!v.ped, trauma: v.trauma !== false, brain: v.brain !== false, burn: v.burn !== false, red: v.red !== false, yellow: v.yellow !== false, green: v.green !== false, ord: +v.ord || 0, sample: !!v.sample }; });
    sub('teams', 'teams', function (id, v) { return { id: id, name: String(v.name || ''), ord: +v.ord || 0 }; });
    sub('supplies', 'supplies', function (id, v) { return { id: id, name: String(v.name || ''), stock: +v.stock || 0, ord: +v.ord || 0, sample: !!v.sample }; });
    sub('procedures', 'procs', function (id, v) { return { id: id, name: String(v.name || ''), min: +v.min || 0, needs: (v.needs && typeof v.needs === 'object') ? v.needs : {}, ord: +v.ord || 0, sample: !!v.sample }; });
    sub('sections', 'sections', function (id, v) { return { id: id, name: String(v.name || ''), startedAt: +v.startedAt || 0, pausedAt: +v.pausedAt || 0, ord: +v.ord || 0 }; });
    sub('treatments', 'treats', function (id, v) { return { id: id, team: String(v.team || ''), caseNo: String(v.caseNo || ''), pid: String(v.pid || ''), pname: String(v.pname || ''), min: +v.min || 0, items: Array.isArray(v.items) ? v.items : [], t: +v.t || 0, el: v.el == null ? null : +v.el }; });
    sub('cases', 'cases', function (id, v) { return { no: id, memo: String(v.memo || ''), preg: !!v.preg, child: !!v.child, trauma: !!v.trauma, brain: !!v.brain, burn: !!v.burn, tag: validTag(v.tag), sec: String(v.sec || ''), m1: v.m1 == null ? null : +v.m1, t1: validTag(v.t1), m2: v.m2 == null ? null : +v.m2, t2: validTag(v.t2), fix: v.fix == null ? null : String(v.fix), ord: +v.ord || 0, sample: !!v.sample }; });
    sub('methods', 'methods', function (id, v) { return { id: id, name: String(v.name || ''), min: +v.min || 0, ord: +v.ord || 0, sample: !!v.sample }; });
    sub('transports', 'log', function (id, v) { var ci = id.indexOf(':'); return { id: id, team: String(v.team || 'a'), caseNo: String(v.caseNo || (ci >= 0 ? id.slice(ci + 1) : id)), hid: String(v.hid || ''), hname: String(v.hname || ''), mid: String(v.mid || ''), mname: String(v.mname || ''), min: +v.min || 0, tag: validTag(v.tag), t: +v.t || 0 }; });
    renderBanner();
  })();
})();
</script>
</body></html>
